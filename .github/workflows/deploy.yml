name: Deploy Heliflow Frontend (Test & Main)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '165.227.82.221' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/opt/heliflow-frontend"

            echo "🚀 Starting frontend deployment on remote server..."

            git config --global --add safe.directory '*' || true

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Initializing Git repository in $APP_DIR..."
              rm -rf "$APP_DIR"
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/helicalconsulting/Procnex_Frontend_2.0.git "$APP_DIR"
            else
              echo "Pulling latest code..."
              cd "$APP_DIR"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/helicalconsulting/Procnex_Frontend_2.0.git
              git fetch --all
              git reset --hard origin/master
            fi

            cd "$APP_DIR"

            # 1. Build & Run Main Container (Port 8081)
            echo "📦 Building Main Frontend (procnexapi.procnex.com)..."
            docker build \
              --build-arg VITE_API_URL=https://procnexapi.procnex.com/api \
              -t heliflow-frontend-main:latest .

            echo "🔄 Restarting Main container..."
            docker rm -f heliflow-frontend-main || true
            docker run -d \
              --name heliflow-frontend-main \
              --restart unless-stopped \
              -p 8081:80 \
              heliflow-frontend-main:latest

            # 2. Build & Run Testing Container (Port 8082)
            echo "📦 Building Testing Frontend (procnexapi-test.procnex.com)..."
            docker build \
              --build-arg VITE_API_URL=https://procnexapi-test.procnex.com/api \
              -t heliflow-frontend-test:latest .

            echo "🔄 Restarting Testing container..."
            docker rm -f heliflow-frontend-test || true
            docker run -d \
              --name heliflow-frontend-test \
              --restart unless-stopped \
              -p 8082:80 \
              heliflow-frontend-test:latest

            # 3. Reload Host Nginx
            if command -v nginx > /dev/null 2>&1; then
              sudo nginx -t && sudo systemctl reload nginx || true
            fi

            echo "✅ Both frontend containers deployed successfully!"
            docker ps | grep heliflow-frontend
