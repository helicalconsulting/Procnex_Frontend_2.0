name: Deploy Heliflow Frontend (Test & Main)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build static assets
        run: |
          npm ci
          npm run build

      - name: Copy build artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '165.227.82.221' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "dist,nginx.conf,Dockerfile"
          target: "/opt/heliflow-frontend"
          overwrite: true

      - name: Restart containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '165.227.82.221' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 5m
          timeout: 60s
          script: |
            set -e
            cd /opt/heliflow-frontend

            echo "📦 Building lightweight Nginx image..."
            docker build -t heliflow-frontend:latest .

            echo "🔄 Restarting Main container (Port 8081)..."
            docker rm -f heliflow-frontend-main || true
            docker run -d \
              --name heliflow-frontend-main \
              --restart unless-stopped \
              -p 8081:80 \
              heliflow-frontend:latest

            echo "🔄 Restarting Testing container (Port 8082)..."
            docker rm -f heliflow-frontend-test || true
            docker run -d \
              --name heliflow-frontend-test \
              --restart unless-stopped \
              -p 8082:80 \
              heliflow-frontend:latest

            # Clean dangling build cache
            docker image prune -f || true

            # Reload Host Nginx
            if command -v nginx > /dev/null 2>&1; then
              sudo nginx -t && sudo systemctl reload nginx || true
            fi

            echo "✅ Frontend deployed in under 1 minute!"
            docker ps | grep heliflow-frontend
